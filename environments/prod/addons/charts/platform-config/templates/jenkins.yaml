{{- if .Values.jenkins.enabled }}
# Jenkins' namespace: labelled so its HTTPRoute may use the public gateway
# (jenkins.<domain>, protected by Cloudflare Access).
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# The deploy trigger token, copied from the vault. Jenkins mounts it
# (additionalExistingSecrets) and JCasC turns it into a credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-trigger
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault
  target:
    name: jenkins-trigger
  data:
    - secretKey: token
      remoteRef:
        key: jenkins-trigger-token
---
# Slack webhook for deploy notifications (Phase 9). The build pods read it
# as the environment variable SLACK_WEBHOOK_URL (see deploy.Jenkinsfile).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-slack
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault
  target:
    name: jenkins-slack
  data:
    - secretKey: url
      remoteRef:
        key: mern-slack-webhook-url

{{- /* Identities of the backup and restore-drill build pods.
       Workload Identity maps each one to its own Google service account
       (foundation/dr-identities.tf); AWS and Azure trust the same names.
       They never talk to the Kubernetes API, so no API token is mounted. */}}
{{- range $sa := list "mongo-backup" "mongo-restore" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: jenkins
  annotations:
    iam.gke.io/gcp-service-account: {{ $sa }}@{{ $.Values.secretStore.gcpsm.projectID }}.iam.gserviceaccount.com
automountServiceAccountToken: false

{{- end }}
{{- end }}
