controller:
  # Builds never run on the controller itself - only in agent pods.
  numExecutors: 0
  additionalPlugins:
    - job-dsl:3732.v9a_c49a_61a_313          # lets JCasC create jobs from code
    - generic-webhook-trigger:2.4.3          # GitHub Actions starts deploy-mern with a token
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

  # Public address, through the GKE gateway. Cloudflare Access protects it
  # (global-platform/jenkins-access.tf); the port-forward still works too.
  jenkinsUrl: https://jenkins.rishavmukhopadhyay.store
  httpRoute:
    enabled: true
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - jenkins.rishavmukhopadhyay.store

  # vault -> ExternalSecret "jenkins-trigger" -> mounted file
  # -> available to JCasC below as ${jenkins-trigger-token}
  additionalExistingSecrets:
    - name: jenkins-trigger
      keyName: token

  JCasC:
    defaultConfig: true
    configScripts:
      welcome: |
        jenkins:
          systemMessage: "MERN shop CD - configured as code (gcp-platform + platform-deployments). Changes made in this UI are LOST on the next rebuild."
      trigger-credential: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - string:
                      scope: GLOBAL
                      id: deploy-mern-trigger-token
                      description: "Token GitHub Actions must send to start deploy-mern"
                      secret: "${jenkins-trigger-token}"
      jobs: |
        jobs:
          - script: |
              pipelineJob('deploy-mern') {
                description('Deploy one MERN service: Helm rolling update, auto-rollback, smoke test')
                parameters {
                  choiceParam('SERVICE', ['identity-service', 'catalog-service', 'commerce-service', 'notification-service', 'api-gateway-service', 'client-service'], 'Which service to deploy')
                  stringParam('IMAGE_TAG', '', 'Image tag already pushed to the registries, e.g. main-a6a9d50')
                  stringParam('TARGETS', 'gcp,azure,aws', 'Clouds to deploy to, in this order (comma-separated)')
                }
                // GitHub Actions POSTs {"service": "...", "image_tag": "..."} to
                // /generic-webhook-trigger/invoke with the trigger token.
                properties {
                  pipelineTriggers {
                    triggers {
                      genericTrigger {
                        genericVariables {
                          genericVariable {
                            key('SERVICE')
                            value('$.service')
                          }
                          genericVariable {
                            key('IMAGE_TAG')
                            value('$.image_tag')
                          }
                        }
                        tokenCredentialId('deploy-mern-trigger-token')
                        causeString('GitHub Actions: deploy $SERVICE $IMAGE_TAG')
                        printContributedVariables(true)
                        printPostContent(false)
                        silentResponse(false)
                        // only the 6 deployable services; anything else is ignored
                        regexpFilterText('$SERVICE')
                        regexpFilterExpression('^(identity|catalog|commerce|notification|api-gateway|client)-service$')
                      }
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/ppmcad16a-cloud-platform/platform-deployments.git')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('pipelines/deploy.Jenkinsfile')
                    lightweight(true)
                  }
                }
              }
              pipelineJob('backup-mongo') {
                description('Encrypted MongoDB backup to GCS + S3 + Azure Blob (nightly while the platform runs)')
                properties {
                  pipelineTriggers {
                    triggers {
                      cron {
                        spec('H 21 * * *')   // about 02:30 in India (Jenkins runs in UTC)
                      }
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/ppmcad16a-cloud-platform/platform-deployments.git')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('pipelines/backup.Jenkinsfile')
                    lightweight(true)
                  }
                }
              }
              pipelineJob('restore-drill') {
                description('Restore the newest backup from one cloud into mern_restore_drill and verify it')
                parameters {
                  choiceParam('SOURCE', ['gcs', 's3', 'azure'], 'Which cloud copy to restore from')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/ppmcad16a-cloud-platform/platform-deployments.git')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('pipelines/restore-drill.Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

# Jenkins' home is NOT kept on a disk: everything is rebuilt from code each
# session (and no disk can be left behind).
persistence:
  enabled: false

# Service account used by the build pods (see deployer-rbac.yaml).
serviceAccountAgent:
  create: true
  name: jenkins-deployer
